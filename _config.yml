# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: thetvdh
description: ""
author: Thetvdh
url: https://blog.thetvdh.com
baseurl: ""
lang: en

# Uncomment to switch on the matching footer links.
# github_username: thetvdh
# email: you@example.com

# Optional strapline beside the wordmark. Blank = not rendered.
masthead_note: ""

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
permalink: /:year/:slug/
timezone: Europe/London
future: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  style: compressed
  sass_dir: _sass
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
collections:
  notes:
    output: true
    permalink: /notes/:title/

defaults:
  # Later entries win, so the catch-all goes first and the specific types
  # override it.
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: notes
    values:
      layout: note

# ---------------------------------------------------------------------------
# Exclusions
# ---------------------------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .vscode
  - .github
