<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">

{% seo %}

<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

{%- comment -%}
  Applied before first paint so a reader who picked a theme never sees the
  other one flash in. Kept inline and tiny for that reason.
{%- endcomment -%}
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) {}
  })();
</script>
