<header class="masthead">
  <div class="shell masthead__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {%- if site.masthead_note and site.masthead_note != "" -%}
      <p class="masthead__note label">{{ site.masthead_note }}</p>
    {%- else -%}
      <span></span>
    {%- endif -%}

    <div class="masthead__tools">
      <nav class="nav" aria-label="Primary">
        {%- for item in site.data.navigation -%}
          {%- assign target = item.link | relative_url -%}
          <a class="nav__link" href="{{ target }}"
             {% if page.url == item.link %}aria-current="page"{% endif %}>
            <span class="nav__num" aria-hidden="true">{{ item.num }}</span>
            <span>{{ item.name }}</span>
          </a>
        {%- endfor -%}
      </nav>

      <button class="theme-toggle" type="button" data-theme-toggle
              aria-label="Switch colour theme">
        <span data-theme-label>auto</span>
      </button>
    </div>
  </div>
</header>
