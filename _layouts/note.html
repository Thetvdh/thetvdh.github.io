---
layout: base
---
{%- comment -%}
  Notes are short. Same grid as a post, lighter header — no spec sheet.
{%- endcomment -%}
<div class="shell">
  <article class="article">
    <div class="article__rail" aria-hidden="true">
      <p class="label">Note</p>
    </div>

    <div class="article__body">
      <header class="article__head">
        <h1 class="article__title">{{ page.title }}</h1>
        <p class="mono" style="color: var(--ink-muted); margin: 0;">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
          {%- if page.tags.size > 0 %} · {{ page.tags | join: " · " }}{% endif -%}
        </p>
      </header>

      <div class="prose">
        {{ content }}
      </div>

      <nav class="postnav" aria-label="Notes">
        <a class="postnav__item postnav__item--prev" href="{{ '/notes/' | relative_url }}">
          <span class="postnav__dir">&larr; Back</span>
          <span class="postnav__title">All notes</span>
        </a>
      </nav>
    </div>
  </article>
</div>
