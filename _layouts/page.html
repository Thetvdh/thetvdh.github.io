---
layout: base
---
<div class="shell">
  <header class="pagehead">
    <p class="pagehead__eyebrow label">{{ page.eyebrow | default: "Page" }}</p>
    <div>
      <h1 class="pagehead__title">{{ page.title }}</h1>
    </div>
  </header>

  <div class="article">
    <div class="article__rail"></div>
    <div class="article__body">
      <div class="prose">
        {{ content }}
      </div>
    </div>
  </div>
</div>
