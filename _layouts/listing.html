---
layout: base
---
{%- comment -%}
  Section index. Pages using this layout set `collection` to "posts" or
  "notes"; anything else can render its own body instead.
{%- endcomment -%}
<div class="shell">
  <header class="pagehead">
    <p class="pagehead__eyebrow label">{{ page.eyebrow | default: "Index" }}</p>
    <div>
      <h1 class="pagehead__title">{{ page.title }}</h1>
    </div>
  </header>

  {{ content }}
</div>
